name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please do not include API keys or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Watch app, Android companion, Docs, Other]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
